<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202020; }
  #skin { display: block; width: 100%; height: 100%; outline: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 10px;
    text-align: center; color: #9a9a9a; font: 12px "Segoe UI", sans-serif;
    pointer-events: none; transition: opacity .2s ease;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="skin"></canvas>
<div id="hint">Перетащите для вращения · колесо — масштаб</div>
<script src="skinview3d.bundle.js"></script>
<script>
(function () {
  const canvas = document.getElementById("skin");
  let currentSkin = null;
  let viewer = null;

  function size() {
    return [Math.max(320, window.innerWidth), Math.max(320, window.innerHeight)];
  }

  function boot(skin) {
    const [width, height] = size();
    viewer = new skinview3d.SkinViewer({
      canvas: canvas,
      width: width,
      height: height,
      skin: skin
    });
    viewer.autoRotate = false;
    viewer.animation = new skinview3d.WalkingAnimation();
    viewer.controls.enablePan = false;
    viewer.controls.enableZoom = true;
    viewer.controls.enableRotate = true;
    currentSkin = skin;
  }

  window.fionixSkin = {
    setSkin: function (data, model) {
      currentSkin = data;
      if (!viewer) { boot(data); return; }
      viewer.loadSkin(data, { model: model || "classic" });
    },
    setModel: function (model) {
      if (viewer && currentSkin) {
        viewer.loadSkin(currentSkin, { model: model || "classic" });
      }
    },
    setCape: function (data) {
      if (!viewer) return;
      viewer.loadCape(data || null);
    },
    setHint: function (show) {
      document.getElementById("hint").classList.toggle("hidden", !show);
    }
  };

  window.addEventListener("resize", function () {
    if (!viewer) return;
    const [width, height] = size();
    viewer.setSize(width, height);
  });
})();
</script>
</body>
</html>
